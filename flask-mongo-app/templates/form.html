<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    <h2>Enter Student Data</h2>

    {% if error %}
        <p style="color:red;">Error: {{ error }}</p>
    {% endif %}

    <form method="POST">
        Item ID: <input type="text" name="item_id">
        UUID: <input type="text" name="item_uuid">
        Hash ID: <input type="text" name="hash_id">
        Name: <input type="text" name="name" required><br><br>
        Grade: <input type="text" name="grade" required><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
